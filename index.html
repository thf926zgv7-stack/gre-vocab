<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRE Flashcard">
<meta name="theme-color" content="#0a0e27">
<meta name="description" content="GRE Core Vocabulary Flashcard - Daily Learning with Spaced Repetition">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>GRE Flashcard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#0a0e27;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;padding-top:env(safe-area-inset-top,20px)}
.top-bar{width:100%;max-width:800px;padding:16px 20px 16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:12px}
.top-bar h1{font-size:22px;background:linear-gradient(135deg,#64b5f6,#ce93d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#90a4ae}
.stats-row span{padding:4px 10px;background:#141b3d;border-radius:12px}
.main-container{width:100%;max-width:800px;padding:0 20px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
.tabs{display:flex;gap:4px;background:#141b3d;border-radius:12px;padding:4px;width:fit-content}
.tab-btn{padding:10px 22px;border:none;border-radius:10px;cursor:pointer;font-size:14px;color:#90a4ae;background:transparent;transition:.2s;font-family:inherit}
.tab-btn.active{background:#1e3a5f;color:#64b5f6;font-weight:600}
.tab-btn:hover:not(.active){color:#b0bec5}
.progress-bar-wrap{width:100%;max-width:600px;background:#141b3d;border-radius:8px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#64b5f6,#ce93d8);border-radius:8px;transition:width .4s}
.progress-text{font-size:12px;color:#90a4ae;text-align:center;margin-top:4px}
.flashcard{width:100%;max-width:500px;height:280px;perspective:1000px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.flashcard-front{background:linear-gradient(145deg,#1a2740,#1e3050);border:1px solid #2a3f60;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.flashcard-back{background:linear-gradient(145deg,#1e2a3a,#1a2740);border:1px solid #3a5060;box-shadow:0 8px 32px rgba(0,0,0,.3);transform:rotateY(180deg)}
.flashcard-front .word{font-size:36px;font-weight:700;color:#e8eaed;letter-spacing:1px;margin-bottom:8px}
.flashcard-front .pos-hint{font-size:13px;color:#78909c}
.flashcard-back .definition{font-size:20px;color:#e8eaed;line-height:1.6;font-family:'Microsoft YaHei',sans-serif}
.flashcard .tap-hint{font-size:12px;color:#546e7a;margin-top:12px}
.card-counter{font-size:14px;color:#78909c;text-align:center}
.action-buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 32px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.btn-know{background:#1b5e20;color:#a5d6a7}
.btn-know:hover{background:#2e7d32;transform:translateY(-2px)}
.btn-unknown{background:#b71c1c;color:#ef9a9a}
.btn-unknown:hover{background:#c62828;transform:translateY(-2px)}
.btn-skip{background:transparent;color:#78909c;border:1px solid #37474f}
.btn-skip:hover{background:#141b3d}
.btn-weekly{background:linear-gradient(135deg,#4a148c,#6a1b9a);color:#e1bee7}
.btn-weekly:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(106,27,154,.4)}
.completion{text-align:center;padding:40px}
.completion h2{font-size:28px;margin-bottom:12px;background:linear-gradient(135deg,#64b5f6,#ce93d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.completion p{color:#90a4ae;margin-bottom:20px}
.dashboard{width:100%;max-width:600px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat-card{background:#141b3d;border-radius:12px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:#64b5f6}
.stat-card .label{font-size:12px;color:#78909c;margin-top:4px}
.word-list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:6px}
.word-item{background:#141b3d;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.word-item .w{font-weight:700;color:#e0e0e0;font-size:15px}
.word-item .d{color:#90a4ae;font-size:13px}
.word-item .tag{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.tag-mastered{background:#1b5e20;color:#a5d6a7}
.tag-learning{background:#e65100;color:#ffcc80}
.tag-review{background:#4a148c;color:#e1bee7}
.tag-new{background:#141b3d;color:#78909c}
.az-filter{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:600px;width:100%;margin-bottom:8px}
.az-btn{width:28px;height:28px;border:1px solid #2a3f60;border-radius:6px;background:#141b3d;color:#90a4ae;font-size:11px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;display:flex;align-items:center;justify-content:center}
.az-btn:hover,.az-btn.active{background:#1e3a5f;color:#64b5f6;border-color:#4a6fa0}
.az-btn:active{transform:scale(.92)}
.quiz-option{width:100%;padding:14px 20px;margin:6px 0;border:1px solid #2a3f60;border-radius:12px;background:#141b3d;color:#e0e0e0;font-size:15px;cursor:pointer;transition:.2s;text-align:left;font-family:inherit}
.quiz-option:hover{background:#1e3050;border-color:#4a6fa0}
.quiz-option.correct{background:#1b5e20!important;border-color:#4caf50!important;color:#a5d6a7!important}
.quiz-option.wrong{background:#b71c1c!important;border-color:#f44336!important;color:#ef9a9a!important}
.setting-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.setting-row input{width:80px;padding:8px 12px;border:1px solid #2a3f60;border-radius:8px;background:#141b3d;color:#e0e0e0;font-size:14px;text-align:center;font-family:inherit}
.reset-btn{margin-top:20px;padding:10px 20px;background:#b71c1c;color:#ef9a9a;border:none;border-radius:8px;cursor:pointer;font-family:inherit}
@media(max-width:500px){.flashcard{height:220px}.flashcard-front .word{font-size:26px}.flashcard-back .definition{font-size:16px}.btn{padding:12px 24px;font-size:14px}.tabs{gap:2px}.tab-btn{padding:8px 14px;font-size:12px}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>GRE Flashcard</h1>
  <div class="stats-row">
    <span id="dayLabel">Day 1</span>
    <span id="masteredCount">Mastered: 0</span>
    <span id="totalLearned">Total: 0</span>
  </div>
</div>

<div class="main-container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">Learn</button>
    <button class="tab-btn" onclick="switchTab('review')">Review</button>
    <button class="tab-btn" onclick="switchTab('quiz')">Quiz</button>
    <button class="tab-btn" onclick="switchTab('weekly')">Weekly</button>
    <button class="tab-btn" onclick="switchTab('words')">Words</button>
    <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
  </div>

  <div id="tabContent" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px"></div>
</div>

const STORAGE_KEY = 'gre_flashcard_state';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {wordStates:{}, dailyLog:{}, settings:{dailyGoal:120, startDate:null}};
}

function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
if(!state.settings.startDate) state.settings.startDate = new Date().toISOString().split('T')[0];

function getWordState(word){
  return state.wordStates[word] || {level:0, nextReview:null, learnedDate:null, reviewCount:0, correctCount:0};
}

function setWordState(word, ws){
  state.wordStates[word] = ws;
}

function getDayNumber(){
  const start = new Date(state.settings.startDate + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.floor((now - start) / 86400000) + 1;
}

function getToday(){
  return new Date().toISOString().split('T')[0];
}

function getWordsDueForReview(){
  const today = getToday();
  return WORDS.filter(([w,d])=>{
    const ws = getWordState(w);
    return ws.nextReview && ws.nextReview <= today && ws.level < 5;
  });
}

function getNewWordsForToday(){
  const dailyGoal = state.settings.dailyGoal;
  const today = getToday();
  const todayLog = state.dailyLog[today] || {newWords:[]};
  const alreadyAssigned = todayLog.newWords || [];

  if(alreadyAssigned.length >= dailyGoal) return alreadyAssigned;

  const unseen = WORDS.filter(([w,d])=>{
    const ws = getWordState(w);
    return ws.level === 0 && !alreadyAssigned.includes(w);
  });

  const shuffled = unseen.sort(()=>Math.random()-0.5);
  const needed = dailyGoal - alreadyAssigned.length;
  const newWords = [...alreadyAssigned, ...shuffled.slice(0, needed).map(x=>x[0])];

  if(!state.dailyLog[today]) state.dailyLog[today] = {};
  state.dailyLog[today].newWords = newWords;
  saveState(state);

  return newWords;
}

function getWordsForTab(tab){
  if(tab==='learn'){
    const wordList = getNewWordsForToday();
    return wordList.map(w=>WORDS.find(x=>x[0]===w));
  }else if(tab==='review'){
    return getWordsDueForReview();
  }else if(tab==='weekly'){
    const today = getToday();
    const sevenDaysAgo = new Date(Date.now()-7*86400000).toISOString().split('T')[0];
    const reviewWords = [];
    WORDS.forEach(([w,d])=>{
      const ws = getWordState(w);
      if(ws.learnedDate && ws.learnedDate >= sevenDaysAgo && ws.learnedDate <= today && ws.level < 5){
        reviewWords.push([w,d]);
      }
    });
    return reviewWords.sort(()=>Math.random()-0.5);
  }else if(tab==='quiz'){
    const allSeen = WORDS.filter(([w,d])=>{
      const ws = getWordState(w);
      return ws.level >= 1;
    });
    return allSeen.sort(()=>Math.random()-0.5).slice(0, 30);
  }
  return [];
}

let currentTab = 'learn';
let currentWords = [];
let currentIndex = 0;
let quizWords = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

// Per-tab index preservation
let tabIndices = {learn:0, review:0, weekly:0, quiz:0};

function switchTab(tab){
  // Save current tab's index before switching
  if(currentTab==='learn'||currentTab==='review'||currentTab==='weekly'){
    tabIndices[currentTab] = currentIndex;
  }
  if(currentTab==='quiz'){
    tabIndices.quiz = quizIndex;
  }

  currentTab = tab;

  // Restore target tab's index
  if(tab==='learn'||tab==='review'||tab==='weekly'){
    currentWords = getWordsForTab(tab);
    currentIndex = tabIndices[tab] || 0;
    if(currentIndex >= currentWords.length) currentIndex = 0;
  }else if(tab==='quiz'){
    quizWords = getWordsForTab('quiz');
    quizIndex = tabIndices.quiz || 0;
    quizScore = (tabIndices.quizScore||0);
    quizAnswered = false;
    if(quizIndex >= quizWords.length) {quizIndex=0;quizScore=0;}
  }

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{if(b.textContent.trim().toLowerCase().includes(tab.substring(0,4))) b.classList.add('active')});
  renderTab();
  updateStats();
}

function markWord(word, level, nextReviewDays){
  const ws = getWordState(word);
  ws.level = level;
  ws.learnedDate = ws.learnedDate || getToday();
  ws.reviewCount = (ws.reviewCount||0) + 1;
  if(level >= 4) ws.correctCount = (ws.correctCount||0) + 1;
  const nextDate = new Date(Date.now() + nextReviewDays*86400000);
  ws.nextReview = nextDate.toISOString().split('T')[0];
  setWordState(word, ws);

  const today = getToday();
  if(!state.dailyLog[today]) state.dailyLog[today] = {};
  if(!state.dailyLog[today].completed) state.dailyLog[today].completed = [];
  if(!state.dailyLog[today].completed.includes(word)) state.dailyLog[today].completed.push(word);
  saveState(state);
}

function learnKnow(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  markWord(word, 2, 1);
  currentIndex++;
  renderTab();
  updateStats();
}

function learnUnknown(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  markWord(word, 1, 0);
  currentIndex++;
  renderTab();
  updateStats();
}

function reviewKnow(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  const ws = getWordState(word);
  if(ws.level >= 4){
    markWord(word, 5, 30);
  }else{
    markWord(word, Math.min(ws.level+1, 4), ws.level>=3?7:3);
  }
  currentIndex++;
  renderTab();
  updateStats();
}

function reviewUnknown(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  markWord(word, Math.max(1, getWordState(word).level-1), 1);
  currentIndex++;
  renderTab();
  updateStats();
}

function weeklyKnow(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  markWord(word, Math.min(getWordState(word).level+1, 5), 3);
  currentIndex++;
  renderTab();
  updateStats();
}

function weeklyUnknown(){
  if(currentIndex >= currentWords.length) return;
  const [word, def] = currentWords[currentIndex];
  markWord(word, Math.max(1, getWordState(word).level-1), 1);
  currentIndex++;
  renderTab();
  updateStats();
}

function flipCard(){
  const card = document.querySelector('.flashcard');
  if(card) card.classList.toggle('flipped');
}

function quizAnswer(idx){
  if(quizAnswered || quizIndex >= quizWords.length) return;
  quizAnswered = true;
  tabIndices.quizScore = quizScore;
  const [correctWord, correctDef] = quizWords[quizIndex];
  const options = document.querySelectorAll('.quiz-option');
  options.forEach((opt,i)=>{
    opt.style.pointerEvents = 'none';
    if(quizWords[quizIndex + i] && quizWords[quizIndex + i][0] === correctWord){
      opt.classList.add('correct');
    }
  });
  const selectedWord = quizWords[quizIndex + idx] ? quizWords[quizIndex + idx][0] : '';
  if(selectedWord === correctWord){
    quizScore++;
    const ws = getWordState(correctWord);
    ws.correctCount = (ws.correctCount||0)+1;
    if(ws.level < 4) ws.level = Math.min(ws.level+1, 4);
    setWordState(correctWord, ws);
    saveState(state);
  }else{
    options[idx] && options[idx].classList.add('wrong');
  }
  setTimeout(()=>{
    quizIndex++;
    quizAnswered = false;
    renderTab();
    updateStats();
  }, 800);
}

function renderTab(){
  const content = document.getElementById('tabContent');
  const tab = currentTab;

  if(tab==='learn' || tab==='review' || tab==='weekly'){
    if(currentIndex >= currentWords.length){
      const masteredCount = Object.values(state.wordStates).filter(ws=>ws.level>=4).length;
      content.innerHTML = `<div class="completion">
        <h2>${tab==='learn'?'Daily Learning Complete!':'Review Complete!'}</h2>
        <p>${tab==='learn'?`You studied ${currentWords.length} words today.`:`You reviewed ${currentWords.length} words.`}</p>
        <p style="color:#78909c">Total Mastered: ${masteredCount} / ${WORDS.length}</p>
        <div class="progress-bar-wrap" style="margin:12px auto"><div class="progress-bar" style="width:${(masteredCount/WORDS.length*100).toFixed(1)}%"></div></div>
      </div>`;
      return;
    }

    const [word, def] = currentWords[currentIndex];
    const isReview = tab === 'review';
    const isWeekly = tab === 'weekly';
    const label = isWeekly ? 'Weekly Review' : (isReview ? 'Review' : 'New');
    const knowFn = isWeekly ? 'weeklyKnow()' : (isReview ? 'reviewKnow()' : 'learnKnow()');
    const unkFn = isWeekly ? 'weeklyUnknown()' : (isReview ? 'reviewUnknown()' : 'learnUnknown()');

    content.innerHTML = `
      <div class="card-counter">${label} — ${currentIndex+1} / ${currentWords.length}</div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${((currentIndex)/currentWords.length*100).toFixed(1)}%"></div></div>
      <div class="flashcard" onclick="flipCard()">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <div class="word">${word}</div>
            <div class="tap-hint">Tap to reveal meaning / 点击查看释义</div>
          </div>
          <div class="flashcard-back">
            <div class="definition">${def}</div>
            <div class="tap-hint">Tap to flip back</div>
          </div>
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn btn-unknown" onclick="${unkFn}">Still Learning<br><small>继续学习</small></button>
        <button class="btn btn-know" onclick="${knowFn}">Got It!<br><small>已掌握</small></button>
      </div>`;
  }
  else if(tab==='quiz'){
    if(quizIndex >= quizWords.length || quizWords.length === 0){
      content.innerHTML = `<div class="completion">
        <h2>Quiz Complete!</h2>
        <p>Score: ${quizScore} / ${quizWords.length} (${(quizScore/Math.max(1,quizWords.length)*100).toFixed(0)}%)</p>
        <button class="btn btn-know" onclick="switchTab('quiz')" style="margin-top:16px">New Quiz</button>
      </div>`;
      return;
    }

    if(quizIndex === 0 && quizWords.length === 0){
      quizWords = getWordsForTab('quiz');
    }

    const [correctWord, correctDef] = quizWords[quizIndex];
    const options = [correctWord];
    while(options.length < 4){
      const randWord = WORDS[Math.floor(Math.random()*WORDS.length)][0];
      if(!options.includes(randWord)) options.push(randWord);
    }
    const shuffled = options.sort(()=>Math.random()-0.5);

    content.innerHTML = `
      <div class="card-counter">Quiz — ${quizIndex+1} / ${quizWords.length} | Score: ${quizScore}</div>
      <div class="flashcard" style="cursor:default;height:200px">
        <div class="flashcard-inner" style="transform:none">
          <div class="flashcard-front" style="backface-visibility:visible">
            <div style="font-size:12px;color:#78909c;margin-bottom:12px">What word matches this definition?</div>
            <div class="definition" style="font-size:18px">${correctDef}</div>
          </div>
        </div>
      </div>
      ${shuffled.map((w,i)=>`<button class="quiz-option" onclick="quizAnswer(${i})">${String.fromCharCode(65+i)}. ${w}</button>`).join('')}`;
  }
  else if(tab==='words'){
    const allStates = WORDS.map(([w,d])=>({word:w, def:d, state:getWordState(w)}));
    const filterLevel = (l)=>allStates.filter(x=>x.state.level===l);
    const mastered = filterLevel(4).concat(filterLevel(5));
    const learning = filterLevel(1).concat(filterLevel(2)).concat(filterLevel(3));
    const unseen = filterLevel(0);

    // Build A-Z buttons
    const letters = [];
    for(let i=65;i<=90;i++) letters.push(String.fromCharCode(i));
    const azHtml = letters.map(l=>`<button class="az-btn" onclick="filterByLetter('${l}');event.stopPropagation()">${l}</button>`).join('');

    let html = `<div class="dashboard">
      <div class="stat-card"><div class="num">${mastered.length}</div><div class="label">Mastered</div></div>
      <div class="stat-card"><div class="num">${learning.length}</div><div class="label">Learning</div></div>
      <div class="stat-card"><div class="num">${unseen.length}</div><div class="label">Unseen</div></div>
      <div class="stat-card"><div class="num">${WORDS.length}</div><div class="label">Total</div></div>
    </div>
    <div style="width:100%;max-width:600px;margin-top:8px">
      <select onchange="filterWordList(this.value)" style="padding:8px 12px;border:1px solid #2a3f60;border-radius:8px;background:#141b3d;color:#e0e0e0;font-family:inherit;width:100%;margin-bottom:10px">
        <option value="all">All Words</option>
        <option value="mastered">Mastered (${mastered.length})</option>
        <option value="learning">Learning (${learning.length})</option>
        <option value="unseen">Unseen (${unseen.length})</option>
      </select>
    </div>
    <div class="az-filter" id="azFilter">${azHtml}</div>
    <div class="word-list" id="wordList">`;
    allStates.sort((a,b)=>a.word.localeCompare(b.word)).forEach(x=>{
      const tag = x.state.level>=4?'tag-mastered':(x.state.level>=1?'tag-learning':'tag-new');
      const tagText = x.state.level>=4?'Mastered':(x.state.level>=1?'Learning':'New');
      html += `<div class="word-item" data-level="${x.state.level>=4?'mastered':(x.state.level>=1?'learning':'unseen')}" data-letter="${x.word[0].toUpperCase()}">
        <span><span class="w">${x.word}</span> <span class="d">${x.def}</span></span>
        <span class="tag ${tag}">${tagText}</span>
      </div>`;
    });
    html += `</div>`;
    content.innerHTML = html;
  }
  else if(tab==='settings'){
    const totalMastered = Object.values(state.wordStates).filter(ws=>ws.level>=4).length;
    const totalSeen = Object.values(state.wordStates).filter(ws=>ws.level>=1).length;
    content.innerHTML = `
      <div class="dashboard">
        <div class="stat-card"><div class="num">Day ${getDayNumber()}</div><div class="label">Current Day</div></div>
        <div class="stat-card"><div class="num">${totalMastered}</div><div class="label">Mastered</div></div>
        <div class="stat-card"><div class="num">${totalSeen}</div><div class="label">Seen</div></div>
        <div class="stat-card"><div class="num">${state.settings.dailyGoal}</div><div class="label">Daily Goal</div></div>
      </div>
      <div style="background:#141b3d;border-radius:12px;padding:20px;width:100%;max-width:500px;margin-top:12px">
        <h3 style="margin-bottom:16px">Settings</h3>
        <div class="setting-row">
          <label>Daily Goal (words/day):</label>
          <input type="number" id="dailyGoalInput" value="${state.settings.dailyGoal}" min="20" max="300" step="10">
          <button class="btn btn-know" style="padding:8px 16px;font-size:13px" onclick="updateDailyGoal()">Save</button>
        </div>
        <div class="setting-row" style="margin-top:12px">
          <label>Start Date:</label>
          <input type="date" id="startDateInput" value="${state.settings.startDate}" style="width:auto">
          <button class="btn btn-know" style="padding:8px 16px;font-size:13px" onclick="updateStartDate()">Save</button>
        </div>
        <button class="reset-btn" onclick="resetAll()">Reset All Progress</button>
      </div>`;
  }
}

function filterWordList(filter){
  // Reset A-Z buttons
  document.querySelectorAll('.az-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.word-item').forEach(item=>{
    if(filter==='all') item.style.display='flex';
    else item.style.display = item.dataset.level === filter ? 'flex' : 'none';
  });
}

function filterByLetter(letter){
  // Toggle active state on the clicked button
  document.querySelectorAll('.az-btn').forEach(b=>b.classList.remove('active'));
  const btn = Array.from(document.querySelectorAll('.az-btn')).find(b=>b.textContent===letter);
  if(btn) btn.classList.add('active');
  // Reset level filter dropdown
  const sel = document.querySelector('#wordList').previousElementSibling?.previousElementSibling?.querySelector('select');
  // Filter by letter
  document.querySelectorAll('.word-item').forEach(item=>{
    const match = item.dataset.letter === letter;
    item.style.display = match ? 'flex' : 'none';
  });
}

function updateDailyGoal(){
  const val = parseInt(document.getElementById('dailyGoalInput').value);
  if(val >= 10 && val <= 500){
    state.settings.dailyGoal = val;
    saveState(state);
    alert('Daily goal updated to '+val+' words!');
  }
}

function updateStartDate(){
  const val = document.getElementById('startDateInput').value;
  if(val){
    state.settings.startDate = val;
    saveState(state);
    alert('Start date updated!');
    updateStats();
  }
}

function resetAll(){
  if(confirm('Reset ALL progress? This cannot be undone.')){
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    state.settings.startDate = new Date().toISOString().split('T')[0];
    saveState(state);
    switchTab('learn');
  }
}

function updateStats(){
  const mastered = Object.values(state.wordStates).filter(ws=>ws.level>=4).length;
  const totalSeen = Object.values(state.wordStates).filter(ws=>ws.level>=1).length;
  document.getElementById('dayLabel').textContent = 'Day '+getDayNumber();
  document.getElementById('masteredCount').textContent = 'Mastered: '+mastered;
  document.getElementById('totalLearned').textContent = 'Seen: '+totalSeen;
}

// Initialize
currentWords = getWordsForTab('learn');
renderTab();
updateStats();

// Keyboard shortcuts
document.addEventListener('keydown',(e)=>{
  if(currentTab==='learn'||currentTab==='review'||currentTab==='weekly'){
    if(e.key==='ArrowLeft'||e.key==='1'){
      if(currentTab==='learn') learnUnknown();
      else if(currentTab==='review') reviewUnknown();
      else weeklyUnknown();
    }else if(e.key==='ArrowRight'||e.key==='2'){
      if(currentTab==='learn') learnKnow();
      else if(currentTab==='review') reviewKnow();
      else weeklyKnow();
    }else if(e.key===' '||e.key==='Spacebar'){
      e.preventDefault();
      flipCard();
    }
  }
});
</script>
</body>
</html>
